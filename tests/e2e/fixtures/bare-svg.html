<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiagView with the selector on the svg</title>
<style>body{font-family:sans-serif;margin:0 auto;padding:16px;max-width:760px;background:#fff;color:#1e293b}</style>
</head>
<body>
<!--
  diagramSelector ".diagram" matches the <svg> elements themselves here,
  with no container around them.
-->

<!-- 1. Header layout, 360 x 200, with its own <title> -->
<div id="host"><p>Before the diagram</p><svg class="diagram flow" id="header-svg" data-diagview-layout="header" data-x="kept" style="outline: 0px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200"><title>Order pipeline</title><rect x="10" y="20" width="150" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8"/><text x="85" y="55" text-anchor="middle" font-size="14">Checkout</text><rect x="200" y="120" width="150" height="60" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="275" y="155" text-anchor="middle" font-size="14">Payment</text><path d="M160 50 C200 50 200 150 200 150" stroke="#334155" fill="none"/></svg><p>After the diagram</p></div>

<!-- 2. Floating layout, wider than any card: 1000 x 200 -->
<svg class="diagram" id="wide-svg" data-diagview-layout="floating" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200"><rect x="10" y="10" width="980" height="180" rx="10" fill="#f1f5f9" stroke="#64748b"/><text x="500" y="105" text-anchor="middle" font-size="20">Wide pipeline</text></svg>

<!-- 3. Layout off -->
<svg class="diagram" id="off-svg" data-diagview-layout="off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120"><rect x="10" y="10" width="280" height="100" rx="10" fill="#fce7f3" stroke="#be185d"/><text x="150" y="65" text-anchor="middle" font-size="16">Release</text></svg>

<!-- 4. An <svg class="diagram"> drawn inside another SVG is part of it -->
<svg id="outer" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100"><rect width="300" height="100" fill="#eeeeee"/><svg class="diagram" id="inner" x="10" y="10" width="100" height="50"><rect width="100" height="50" fill="#99ccff"/></svg></svg>

<!-- 5. A matched box holding a matched svg gets one toolbar -->
<div class="diagram" id="box"><svg class="diagram" id="boxed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120"><rect x="10" y="10" width="280" height="100" rx="10" fill="#ede9fe" stroke="#6d28d9"/><text x="150" y="65" text-anchor="middle" font-size="16">Boxed</text></svg></div>

<!-- 6. Empty until a script draws in it, as D3 does -->
<svg class="diagram" id="late" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80"></svg>

<script src="../../../node_modules/@panzoom/panzoom/dist/panzoom.min.js"></script>
</body>
</html>
