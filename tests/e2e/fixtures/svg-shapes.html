<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiagView with SVGs drawn from one kind of element</title>
<style>body{font-family:sans-serif;margin:0 auto;padding:16px;max-width:760px;background:#fff;color:#1e293b}</style>
</head>
<body>
<!-- A sprite the page keeps for its icons, outside any diagram -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="sprite-box" viewBox="0 0 10 10"><rect width="10" height="10" rx="2" fill="#f97316"/></symbol></svg>

<!-- Each of these is drawn with one kind of element only -->
<div class="diagram" id="ellipse"><svg viewBox="0 0 200 100" width="300"><ellipse cx="100" cy="50" rx="90" ry="40" fill="#7c3aed"/></svg></div>
<div class="diagram" id="image"><svg viewBox="0 0 200 100" width="300"><image href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGPgndIBAAHbASoDVGnEAAAAAElFTkSuQmCC" width="200" height="100" preserveAspectRatio="none"/></svg></div>
<div class="diagram" id="use"><svg viewBox="0 0 200 100" width="300"><use href="#sprite-box" x="50" width="100" height="100"/></svg></div>
<div class="diagram" id="fo"><svg viewBox="0 0 200 100" width="300"><foreignObject width="200" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;background:#fde68a;font-size:24px">HTML box</div></foreignObject></svg></div>
<svg class="diagram" id="bare" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="300"><ellipse cx="100" cy="50" rx="90" ry="40" fill="#0d9488"/></svg>

<!-- Error output -->
<div class="diagram" id="empty"><svg viewBox="0 0 200 100"></svg></div>
<div class="diagram" id="zero"><svg viewBox="0 0 0 100"><ellipse cx="100" cy="50" rx="90" ry="40"/></svg></div>
<div class="diagram" id="fragment"><svg viewBox="0 0 200 100"><text x="10" y="50">Render failed: timeout</text></svg></div>
<div class="diagram" id="html-fragment"><svg viewBox="0 0 200 100"><foreignObject width="200" height="100"><div xmlns="http://www.w3.org/1999/xhtml">Error: render failed</div></foreignObject></svg></div>

<script src="../../../node_modules/@panzoom/panzoom/dist/panzoom.min.js"></script>
</body>
</html>
