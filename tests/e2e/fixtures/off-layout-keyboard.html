<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DiagView layout off keyboard</title>
<style>body{font-family:sans-serif;margin:24px;background:#fff;color:#1e293b} .diagram{width:480px;margin:24px 0} .gap{height:1200px}</style>
</head>
<body>
<p><a id="before" href="#top">A link before the diagrams</a></p>
<div class="diagram" id="titled" data-title="Order flow" data-diagview-layout="off">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160"><rect x="20" y="40" width="160" height="80" fill="#dbeafe"/><rect x="300" y="40" width="160" height="80" fill="#dcfce7"/><path d="M180 80H300" stroke="#334155"/></svg>
</div>
<div class="diagram" id="untitled" data-diagview-layout="off">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160"><rect x="160" y="40" width="160" height="80" fill="#fef3c7"/></svg>
</div>
<div class="diagram" id="linked" data-title="Checkout" data-diagview-layout="off">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 160"><a id="inner" xlink:href="#details"><rect x="20" y="40" width="160" height="80" fill="#fce7f3"/><text x="40" y="85">Details</text></a><rect x="300" y="40" width="160" height="80" fill="#e0e7ff"/></svg>
</div>
<div class="diagram" id="header" data-title="Header diagram" data-diagview-layout="header">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160"><rect x="160" y="40" width="160" height="80" fill="#ede9fe"/></svg>
</div>
<p><a id="after" href="#top">A link after the diagrams</a></p>
<div class="gap"></div>
<section id="details"><h2>Details</h2></section>
<div class="gap"></div>
<script src="../../../node_modules/@panzoom/panzoom/dist/panzoom.min.js"></script>
<script src="../../../dist/diagview.umd.js"></script>
</body>
</html>
