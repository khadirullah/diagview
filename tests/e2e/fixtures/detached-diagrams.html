<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiagView with diagrams a page removes</title>
<style>body{font-family:sans-serif;margin:0 auto;padding:16px;max-width:760px;background:#fff;color:#1e293b}</style>
</head>
<body>
<!--
  A single-page app shows one route at a time in <main> and never calls
  destroy(). The spec takes routes out, puts them back and moves them.
-->
<nav id="nav"><p>Navigation</p></nav>
<main id="outlet">
  <section id="route-a">
    <h2>Route A</h2>
    <div class="diagram" id="flow" data-diagview-layout="header" data-title="Order flow"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" width="360" height="140"><rect x="10" y="40" width="140" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8"/><text x="80" y="75" text-anchor="middle" font-size="14">Checkout</text><rect x="210" y="40" width="140" height="60" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="280" y="75" text-anchor="middle" font-size="14">Payment</text><path d="M150 70 H210" stroke="#334155" fill="none"/></svg></div>
    <div class="diagram" id="steps" data-diagview-layout="header" data-title="Steps"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="360" height="100"><rect x="10" y="20" width="340" height="60" rx="8" fill="#fce7f3" stroke="#be185d"/><text x="180" y="55" text-anchor="middle" font-size="14">Ship</text></svg></div>
  </section>
</main>
<script src="../../../node_modules/@panzoom/panzoom/dist/panzoom.min.js"></script>
</body>
</html>
