<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DiagView export and search</title>
<style>body{font-family:sans-serif;margin:24px;background:#fff} .diagram{border:1px solid #ccc;margin:12px 0;width:640px;height:360px}</style>
</head>
<body>

<!-- Small diagram for the baseline export -->
<div class="diagram" id="small" data-title="Small">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120">
  <rect x="10" y="10" width="120" height="50" fill="#dbeafe" stroke="#1e3a8a"/>
  <g transform="translate(20,20)"><foreignObject width="100" height="30"><div xmlns="http://www.w3.org/1999/xhtml">Small</div></foreignObject></g>
  <text x="160" y="40">plain text</text>
</svg>
</div>

<!-- Large diagram, filled in by the script below: over 1 MB serialized, every label a foreignObject -->
<div class="diagram" id="big" data-title="Big"></div>

<!-- Shaped like Mermaid 10 flowchart output -->
<div class="diagram" id="mermaid" data-title="Mermaid shaped">
<svg xmlns="http://www.w3.org/2000/svg" id="mermaid-1" class="flowchart" viewBox="0 0 520 260" width="520" height="260">
  <!-- Mermaid scopes its styles to the SVG id, like its pie slice opacity -->
  <style>#mermaid-1 .pieCircle { opacity: 0.7; }</style>
  <circle class="pieCircle" cx="480" cy="230" r="12" fill="#ffa500"></circle>
  <g>
    <g class="root">
      <g class="clusters">
        <g class="cluster default" id="Backend">
          <rect style="" x="8" y="8" width="504" height="244" fill="#ffffde" stroke="#aaaa33"></rect>
          <g class="cluster-label" transform="translate(230,12)">
            <foreignObject width="60" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; white-space: nowrap;"><span class="nodeLabel">Backend</span></div></foreignObject>
          </g>
        </g>
      </g>
      <g class="edgePaths">
        <path d="M150,130L200,130L250,130" id="L-Gateway-Orders-0" class="edge-thickness-normal edge-pattern-solid flowchart-link LS-Gateway LE-Orders" style="fill:none;" stroke="#333333" stroke-width="2"></path>
        <path d="M350,130L380,130L400,130" id="L-Orders-Billing-0" class="edge-thickness-normal edge-pattern-solid flowchart-link LS-Orders LE-Billing" style="fill:none;" stroke="#333333" stroke-width="2"></path>
      </g>
      <g class="edgeLabels">
        <g class="edgeLabel" transform="translate(200,115)">
          <g class="label" transform="translate(-16,-10)">
            <foreignObject width="32" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; white-space: nowrap;"><span class="edgeLabel">calls</span></div></foreignObject>
          </g>
        </g>
        <g class="edgeLabel"><g class="label" transform="translate(0,0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; white-space: nowrap;"><span class="edgeLabel"></span></div></foreignObject></g></g>
      </g>
      <g class="nodes">
        <g class="node default default flowchart-label" id="flowchart-Gateway-0" data-node="true" data-id="Gateway" transform="translate(100,130)">
          <rect class="basic label-container" style="" rx="0" ry="0" x="-50" y="-22" width="100" height="44" fill="#ececff" stroke="#9370db" stroke-width="1"></rect>
          <g class="label" style="" transform="translate(-35,-10)"><rect></rect>
            <foreignObject width="70" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; white-space: nowrap;"><span class="nodeLabel">Gateway</span></div></foreignObject>
          </g>
        </g>
        <g class="node default default flowchart-label" id="flowchart-Orders-1" data-node="true" data-id="Orders" transform="translate(300,130)">
          <rect class="basic label-container" style="" rx="0" ry="0" x="-50" y="-22" width="100" height="44" fill="#ececff" stroke="#9370db" stroke-width="1"></rect>
          <g class="label" style="" transform="translate(-30,-10)"><rect></rect>
            <foreignObject width="60" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; white-space: nowrap;"><span class="nodeLabel">Orders</span></div></foreignObject>
          </g>
        </g>
        <g class="node default default flowchart-label" id="flowchart-Billing-2" data-node="true" data-id="Billing" transform="translate(450,130)">
          <rect class="basic label-container" style="" rx="0" ry="0" x="-50" y="-22" width="100" height="44" fill="#ececff" stroke="#9370db" stroke-width="1"></rect>
          <g class="label" style="" transform="translate(-28,-10)"><rect></rect>
            <foreignObject width="56" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; white-space: nowrap;"><span class="nodeLabel">Billing</span></div></foreignObject>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
</div>

<!-- Hand-drawn SVG: shapes and labels are siblings, text is white on a blue box -->
<div class="diagram" id="plain" data-title="Plain">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <rect id="p-web" x="20" y="70" width="120" height="50" fill="#1d4ed8" stroke="#1e3a8a"/>
  <text id="p-web-t" x="80" y="100" text-anchor="middle" fill="#ffffff">Frontend</text>
  <rect id="p-api" x="200" y="70" width="120" height="50" fill="#f3f4f6" stroke="#374151"/>
  <text id="p-api-t" x="260" y="100" text-anchor="middle" fill="#111827">Service</text>
  <rect id="p-db" x="380" y="70" width="120" height="50" fill="#f3f4f6" stroke="#374151"/>
  <text id="p-db-t" x="440" y="100" text-anchor="middle" fill="#111827">Storage</text>
  <path d="M140,95 L200,95" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M320,95 L380,95" fill="none" stroke="#374151" stroke-width="2"/>
</svg>
</div>

<!-- draw.io: each label is a <switch> with the drawn HTML label, then a <text> fallback -->
<div class="diagram" id="drawio" data-title="draw.io">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="381px" height="141px" viewBox="-0.5 -0.5 381 141">
<defs/><g>
<rect x="0" y="40" width="120" height="60" rx="9" ry="9" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all"/>
<g transform="translate(-0.5 -0.5)"><switch>
<foreignObject pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow: visible; text-align: left;"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe center; width: 118px; height: 1px; padding-top: 70px; margin-left: 1px;"><div data-drawio-colors="color: rgb(0, 0, 0); " style="box-sizing: border-box; font-size: 0px; text-align: center;"><div id="dio-queue" style="display: inline-block; font-size: 12px; font-family: Helvetica; color: rgb(0, 0, 0); line-height: 1.2; pointer-events: all; white-space: normal; overflow-wrap: normal;">Queue</div></div></div></foreignObject>
<text id="dio-queue-fb" x="60" y="74" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px" text-anchor="middle">Queue</text>
</switch></g>
<path d="M 120 70 L 253.63 70" fill="none" stroke="rgb(0, 0, 0)" stroke-miterlimit="10" pointer-events="stroke"/>
<g transform="translate(-0.5 -0.5)"><switch>
<foreignObject pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow: visible; text-align: left;"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe center; width: 1px; height: 1px; padding-top: 58px; margin-left: 188px;"><div style="box-sizing: border-box; font-size: 0px; text-align: center;"><div id="dio-edge" style="display: inline-block; font-size: 11px; font-family: Helvetica; color: rgb(0, 0, 0); line-height: 1.2; pointer-events: all; white-space: nowrap;">consume</div></div></div></foreignObject>
<text id="dio-edge-fb" x="188" y="61" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="11px" text-anchor="middle">consume</text>
</switch></g>
<rect x="260" y="40" width="120" height="60" fill="#d5e8d4" stroke="#82b366" pointer-events="all"/>
<g transform="translate(-0.5 -0.5)"><switch>
<foreignObject pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow: visible; text-align: left;"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe center; width: 118px; height: 1px; padding-top: 70px; margin-left: 261px;"><div style="box-sizing: border-box; font-size: 0px; text-align: center;"><div id="dio-worker" style="display: inline-block; font-size: 12px; font-family: Helvetica; color: rgb(0, 0, 0); line-height: 1.2; pointer-events: all; white-space: normal; overflow-wrap: normal;">Worker</div></div></div></foreignObject>
<text id="dio-worker-fb" x="320" y="74" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px" text-anchor="middle">Worker</text>
</switch></g>
<g transform="translate(-0.5 -0.5)"><switch>
<foreignObject pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow: visible; text-align: left;"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe center; width: 238px; height: 1px; padding-top: 15px; margin-left: 71px;"><div style="box-sizing: border-box; font-size: 0px; text-align: center;"><div id="dio-title" style="display: inline-block; font-size: 16px; font-family: Helvetica; color: rgb(0, 0, 0); line-height: 1.2; pointer-events: all; font-weight: bold; white-space: normal; overflow-wrap: normal;">Job pipeline</div></div></div></foreignObject>
<text id="dio-title-fb" x="190" y="20" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="16px" text-anchor="middle" font-weight="bold">Job pipeline</text>
</switch></g>
</g>
</svg>
</div>

<script>
  // 50 x 50 grid of foreignObject labels with padding text, about 1.3 MB serialized.
  (function () {
    const pad = "lorem ipsum dolor sit amet ".repeat(16);
    const parts = [];
    for (let r = 0; r < 50; r++) {
      for (let c = 0; c < 50; c++) {
        const x = c * 200, y = r * 80;
        parts.push(
          `<g class="node" transform="translate(${x},${y})">` +
          `<rect width="190" height="70" fill="#ececff" stroke="#9370db"/>` +
          `<foreignObject width="190" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:10px;overflow:hidden;height:70px">` +
          `<span class="nodeLabel">N${r}-${c}</span><span style="display:none">${pad}</span></div></foreignObject></g>`,
        );
      }
    }
    document.getElementById("big").innerHTML =
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10000 4000" width="1000" height="400">${parts.join("")}</svg>`;
  })();
</script>
<script src="../../../node_modules/@panzoom/panzoom/dist/panzoom.min.js"></script>
</body>
</html>
