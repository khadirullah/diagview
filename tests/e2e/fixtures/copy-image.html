<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiagView copy image</title>
<!--
  The suite answers held-back.woff itself, so it can make the export wait
  for the font file longer than the click lasts.
-->
<style>
  @font-face { font-family: "Held Back"; src: url("held-back.woff") format("woff"); }
  body { font-family: sans-serif; margin: 24px; background: #fff; }
  .diagram { width: 600px; }
</style>
</head>
<body>

<div class="diagram" id="diag" data-title="Copy check">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120">
  <rect x="10" y="20" width="110" height="80" rx="8" fill="#dbeafe" stroke="#1e3a8a"/>
  <rect x="180" y="20" width="110" height="80" rx="8" fill="#dcfce7" stroke="#166534"/>
  <path d="M120 60 H180" stroke="#334155" stroke-width="2"/>
  <text x="65" y="65" text-anchor="middle" font-family="Held Back, sans-serif">Order</text>
  <text x="235" y="65" text-anchor="middle" font-family="Held Back, sans-serif">Invoice</text>
</svg>
</div>

<script src="../../../node_modules/@panzoom/panzoom/dist/panzoom.min.js"></script>
</body>
</html>
