<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>diagview repro</title>
<style>body { margin: 0; } .diagram { width: 900px; height: 540px; }</style>
</head>
<body>
<div class="diagram" id="diag"></div>
<script>
  // Build a labeled 2000x1200 grid SVG: 10x6 cells of 200px
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 2000 1200");
  svg.setAttribute("xmlns", NS);
  for (let r = 0; r < 6; r++) {
    for (let c = 0; c < 10; c++) {
      const rect = document.createElementNS(NS, "rect");
      rect.setAttribute("x", c * 200); rect.setAttribute("y", r * 200);
      rect.setAttribute("width", 200); rect.setAttribute("height", 200);
      rect.setAttribute("fill", `hsl(${(r * 10 + c) * 5}, 60%, 75%)`);
      rect.setAttribute("stroke", "#333");
      svg.appendChild(rect);
      const t = document.createElementNS(NS, "text");
      t.setAttribute("x", c * 200 + 100); t.setAttribute("y", r * 200 + 108);
      t.setAttribute("text-anchor", "middle");
      t.setAttribute("font-size", "40");
      t.textContent = String.fromCharCode(65 + c) + (r + 1);
      svg.appendChild(t);
    }
  }
  document.getElementById("diag").appendChild(svg);

  // Capture clipboard writes
  window.__copied = null;
  if (navigator.clipboard) {
    navigator.clipboard.writeText = (t) => { window.__copied = t; return Promise.resolve(); };
  }
</script>
<script src="../../node_modules/@panzoom/panzoom/dist/panzoom.min.js"></script>
<script src="../../dist/diagview.umd.js"></script>
<script>
  DiagView.init({ showMinimap: true, rememberZoom: false, animateOpen: false });
  // Helper used by the test driver: what SVG coord is at the viewport center?
  window.__centerInSVG = () => {
    const viewport = document.getElementById("diagview-modal-viewport");
    const s = viewport && viewport.querySelector("svg");
    if (!s) return null;
    // Measure in ORIGINAL diagram coordinates: rotation lives on the inner
    // .dv-rot-g group, whose CTM includes it (the root's does not).
    const root = s.querySelector(".dv-rot-g") || s;
    let ctm = root.getScreenCTM();
    if (!ctm) return null;
    // WebKit gives getScreenCTM() in zoomed pixels on a zoomed page, while
    // getBoundingClientRect() stays in layout pixels. Map the CTM back to
    // client pixels with a 100x100 probe measured both ways.
    const probe = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    probe.setAttribute("width", "100");
    probe.setAttribute("height", "100");
    probe.style.cssText = "position:absolute;left:0;top:0;width:100px;height:100px;visibility:hidden";
    document.documentElement.appendChild(probe);
    const pm = probe.getScreenCTM();
    const pr = probe.getBoundingClientRect();
    probe.remove();
    const client = Object.assign(probe.createSVGMatrix(), { a: pr.width / 100, d: pr.height / 100, e: pr.left, f: pr.top });
    ctm = client.multiply(pm.inverse()).multiply(ctm);
    const vr = viewport.getBoundingClientRect();
    const pt = s.createSVGPoint();
    pt.x = vr.left + vr.width / 2;
    pt.y = vr.top + vr.height / 2;
    const p = pt.matrixTransform(ctm.inverse());
    return { x: p.x, y: p.y, scale: DiagView.default.state.activePanzoom ? DiagView.default.state.activePanzoom.getScale() : null };
  };
</script>
</body>
</html>
