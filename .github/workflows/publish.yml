name: Publish to NPM

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing signs in with this token, and provenance needs it too

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      - name: Verify Linter
        run: npm run lint
      - name: Verify Tests
        run: npm run test
      - name: Build Bundle
        run: npm run build
      - name: Publish Package
        # No npm token. npm trusts this workflow file for diagview, set up
        # under the package's Trusted publisher settings on npmjs.com.
        run: npm publish --provenance --access public
