name: Publish to NPM

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing signs in with this token, and provenance needs it too

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      - name: Check Tag Matches Version
        # A release tagged v1.2.1 must publish 1.2.1, not whatever
        # package.json holds.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Publish Package
        # npm publish runs prepublishOnly first: lint, unit tests, build,
        # type check, entry point check and bundle size.
        # No npm token. npm trusts this workflow file for diagview, set up
        # under the package's Trusted publisher settings on npmjs.com.
        run: npm publish --provenance --access public
