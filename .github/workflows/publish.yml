name: Publish to NPM

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Installs the dev dependencies and runs every check. It gets no id-token,
  # so no dependency can sign in to npm from here.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        # No npm cache. A release installs fresh from the lockfile rather than
        # from a cache that other workflow runs can write.
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check Tag Matches Version
        # A release tagged v1.2.1 must publish 1.2.1, not whatever
        # package.json holds.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Install Dependencies
        run: npm ci
      # The same checks prepublishOnly runs before a local publish.
      - name: Run Linter
        run: npm run lint
      - name: Run Tests
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Check Types
        run: npm run typecheck
      - name: Check Package Entry Points
        run: npm run test:entries
      - name: Check Bundle Size
        run: npm run size
      - name: Pack
        run: npm pack
      - name: Upload Package
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: diagview-*.tgz
          if-no-files-found: error
          retention-days: 7

  # Publishes the tarball the build job made. It runs no package code, so
  # the id-token stays with npm.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing signs in with this token, and provenance needs it too
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
      - name: Download Package
        uses: actions/download-artifact@v7
        with:
          name: package
      - name: Publish Package
        # No npm token. npm trusts this workflow file for diagview, set up
        # under the package's Trusted publisher settings on npmjs.com.
        # --ignore-scripts because the build job already ran the checks.
        run: npm publish ./diagview-*.tgz --ignore-scripts --provenance --access public
